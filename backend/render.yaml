services:
  - type: web
    name: sahara-backend
    env: python
    buildCommand: "pip install fastapi uvicorn pydantic pydantic-settings pyjwt sqlalchemy psycopg2-binary"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
